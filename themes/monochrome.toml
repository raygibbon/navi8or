[theme]
format = 2
name = "Monochrome"

[ui]
style = "classic"

[ui.header]
foreground = "white"
background = "black"

[ui.status]
foreground = "light_gray"
background = "black"

[ui.message]
foreground = "white"
background = "black"

[ui.text]
foreground = "light_gray"
background = "black"

[ui.accent]
foreground = "white"
background = "black"

[ui.surface_alt]
foreground = "black"
background = "white"

[ui.dialog]
foreground = "white"
background = "black"

[ui.dialog_title]
foreground = "black"
background = "white"

[ui.text_dim]
foreground = "dark_gray"
background = "black"

[ui.selection]
foreground = "black"
background = "white"

[ui.keybar]
foreground = "black"
background = "white"

[ui.keybar_selected]
foreground = "white"
background = "dark_gray"

[ui.keybar_key]
foreground = "white"
background = "black"

[ui.keybar_disabled]
foreground = "dark_gray"
background = "white"

[ui.menu]
foreground = "light_gray"
background = "black"

[ui.menu_disabled]
foreground = "dark_gray"
background = "black"

[ui.menu_selected]
foreground = "white"
background = "black"

[ui.menu_selected_disabled]
foreground = "dark_gray"
background = "black"

[ui.frame]
style = "single"
space = false
shadow = false

[ui.viewer_line_number]
foreground = "dark_gray"
background = "black"

[ui.viewer_search_match]
foreground = "black"
background = "white"

[ui.progress]
foreground = "black"
background = "white"

[ui.pane_title]
foreground = "light_gray"
background = "black"

[ui.pane_title_active]
foreground = "black"
background = "white"

[ui.background]
foreground = "light_gray"
background = "black"

[ui.surface]
foreground = "light_gray"
background = "black"

[ui.border]
foreground = "dark_gray"
background = "black"

[ui.border_active]
foreground = "black"
background = "white"

[ui.selection_inactive]
foreground = "light_gray"
background = "black"

[ui.error]
foreground = "white"
background = "black"

[ui.warning]
foreground = "light_gray"
background = "black"

[symbols]
directory = ">"
parent = "^"
selected = ">"
upload = "^"
download = "v"
