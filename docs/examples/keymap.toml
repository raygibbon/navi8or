# nav -i docs/examples/keymap.toml [left-directory] [right-directory]
# Modern command-to-key UI profile. Omitted options inherit normal defaults.
# Copy a bundled themes/*.toml when customizing a complete palette.
[profile]
name = "Keymap example"
format = 2

[panes]
view = "full"
directories_first = true

[shortcuts]
show_function_bar = true
show_menu_keys = true
show_dialog_keys = true
show_help_keys = true

[keys]
help = ["F1", "Ctrl+H"]
quit = ["Ctrl+Q", "F10"]
menu = ["Ctrl+\\", "F2"]
pane_switch = ["Tab", "Ctrl+P S"]
parent = ["Backspace", "Alt+Up", "Ctrl+PgUp", "Ctrl+N P"]
view = ["F3", "Ctrl+V V"]
edit = "F4"
copy = ["F5", "Ctrl+F C", "Ctrl+X C"]
move = ["F6", "Ctrl+F M"]
mkdir = ["F7", "Ctrl+F K"]
delete = ["F8", "Ctrl+F D"]
location = ["Ctrl+L", "Ctrl+N O"]
refresh = ["Ctrl+N R", "Ctrl+R R"]
preferences = "Ctrl+T P"

[keys.viewer.commands]
download = "Alt+D"
