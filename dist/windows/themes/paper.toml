[theme]
format = 2
name = "Paper"

[ui]
style = "modern"

[ui.header]
foreground = "blue"
background = "white"

[ui.status]
foreground = "dark_gray"
background = "white"

[ui.message]
foreground = "blue"
background = "white"

[ui.text]
foreground = "black"
background = "white"

[ui.accent]
foreground = "blue"
background = "white"

[ui.surface_alt]
foreground = "white"
background = "blue"

[ui.dialog]
foreground = "black"
background = "light_gray"

[ui.dialog_title]
foreground = "blue"
background = "light_gray"

[ui.text_dim]
foreground = "dark_gray"
background = "white"

[ui.selection]
foreground = "white"
background = "blue"

[ui.keybar]
foreground = "black"
background = "white"

[ui.keybar_selected]
foreground = "white"
background = "blue"

[ui.keybar_key]
foreground = "white"
background = "blue"

[ui.keybar_disabled]
foreground = "dark_gray"
background = "white"

[ui.menu]
foreground = "black"
background = "light_gray"

[ui.menu_disabled]
foreground = "dark_gray"
background = "light_gray"

[ui.menu_selected]
foreground = "blue"
background = "white"

[ui.menu_selected_disabled]
foreground = "red"
background = "white"

[ui.frame]
style = "single"
space = false
shadow = false

[ui.viewer_line_number]
foreground = "dark_gray"
background = "white"

[ui.viewer_search_match]
foreground = "black"
background = "yellow"

[ui.progress]
foreground = "white"
background = "blue"

[ui.pane_title]
foreground = "dark_gray"
background = "white"

[ui.pane_title_active]
foreground = "blue"
background = "white"

[ui.background]
foreground = "black"
background = "white"

[ui.surface]
foreground = "black"
background = "white"

[ui.border]
foreground = "dark_gray"
background = "white"

[ui.border_active]
foreground = "blue"
background = "white"

[ui.selection_inactive]
foreground = "black"
background = "light_gray"

[ui.path]
foreground = "dark_gray"
background = "white"

[ui.column_header]
foreground = "dark_gray"
background = "white"

[ui.error]
foreground = "white"
background = "red"

[ui.warning]
foreground = "magenta"
background = "white"

[symbols]
directory = "▸"
parent = "↑"
selected = "›"
upload = "↑"
download = "↓"
