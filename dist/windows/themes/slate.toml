[theme]
format = 2
name = "Slate"

[ui]
style = "modern"

[ui.header]
foreground = "light_cyan"
background = "dark_gray"

[ui.status]
foreground = "white"
background = "dark_gray"

[ui.message]
foreground = "white"
background = "red"

[ui.text]
foreground = "light_gray"
background = "black"

[ui.accent]
foreground = "light_cyan"
background = "black"

[ui.surface_alt]
foreground = "black"
background = "cyan"

[ui.dialog]
foreground = "light_gray"
background = "dark_gray"

[ui.dialog_title]
foreground = "cyan"
background = "dark_gray"

[ui.text_dim]
foreground = "dark_gray"
background = "black"

[ui.selection]
foreground = "black"
background = "cyan"

[ui.keybar]
foreground = "black"
background = "cyan"

[ui.keybar_selected]
foreground = "white"
background = "blue"

[ui.keybar_key]
foreground = "white"
background = "blue"

[ui.keybar_disabled]
foreground = "dark_gray"
background = "cyan"

[ui.menu]
foreground = "light_gray"
background = "dark_gray"

[ui.menu_disabled]
foreground = "dark_gray"
background = "dark_gray"

[ui.menu_selected]
foreground = "light_cyan"
background = "dark_gray"

[ui.menu_selected_disabled]
foreground = "light_red"
background = "dark_gray"

[ui.frame]
style = "single"
space = true
shadow = false

[ui.viewer_line_number]
foreground = "cyan"
background = "black"

[ui.viewer_search_match]
foreground = "black"
background = "yellow"

[ui.progress]
foreground = "black"
background = "cyan"

[ui.pane_title]
foreground = "cyan"
background = "black"

[ui.pane_title_active]
foreground = "white"
background = "blue"

[ui.background]
foreground = "light_gray"
background = "black"

[ui.surface]
foreground = "light_gray"
background = "black"

[ui.border]
foreground = "cyan"
background = "black"

[ui.border_active]
foreground = "white"
background = "blue"

[ui.selection_inactive]
foreground = "light_gray"
background = "black"

[ui.error]
foreground = "white"
background = "red"

[ui.warning]
foreground = "white"
background = "dark_gray"

[symbols]
directory = "▸"
parent = "↑"
selected = "»"
upload = "↑"
download = "↓"
