"cursor.page_up" = "PageUp"
"cursor.page_down" = "PageDown"
"dialog.accept" = "Enter"
"dialog.cancel" = ["Escape", "Ctrl+Q"]

[colors.file]
foreground = "light_gray"
background = "blue"

[colors.directory]
