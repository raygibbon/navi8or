# Complete UI profile. Solar Dark is the unchanged startup default.
[profile]
format = 2
name = "Classic TDX"

[ui]
style = "classic"

[colors]
# Semantic role palettes, using Navi8or's sixteen named colours.
[colors.header]
foreground = "light_cyan"
background = "red"
[colors.status]
foreground = "white"
background = "brown"
[colors.message]
foreground = "white"
background = "red"
[colors.text]
foreground = "light_gray"
background = "blue"
[colors.accent]
foreground = "white"
background = "blue"
[colors.surface_alt]
foreground = "black"
background = "cyan"
[colors.dialog]
foreground = "black"
background = "light_gray"
[colors.dialog_title]
foreground = "light_blue"
background = "light_gray"
[colors.text_dim]
foreground = "dark_gray"
background = "light_gray"
[colors.selection]
foreground = "white"
background = "magenta"
[colors.keybar]
foreground = "black"
background = "cyan"
[colors.keybar_selected]
foreground = "yellow"
background = "cyan"

[colors.keybar_key]
foreground = "white"
background = "blue"

[colors.keybar_disabled]
foreground = "dark_gray"
background = "cyan"
[colors.menu]
foreground = "black"
background = "light_gray"
[colors.menu_disabled]
foreground = "dark_gray"
background = "light_gray"
[colors.menu_selected]
foreground = "white"
background = "green"
[colors.menu_selected_disabled]
foreground = "dark_gray"
background = "green"

[ui.frame]
style = "combine"
space = true
shadow = true

# Navi8or-specific semantic roles.
[colors.viewer_line_number]
foreground = "light_cyan"
background = "blue"
[colors.viewer_search_match]
foreground = "black"
background = "yellow"
[colors.progress]
foreground = "black"
background = "light_gray"

[colors.pane_title]
foreground = "black"
background = "cyan"
[colors.pane_title_active]
foreground = "yellow"
background = "cyan"

[colors.background]
foreground = "light_gray"
background = "blue"

[colors.surface]
foreground = "light_gray"
background = "blue"

[colors.border]
foreground = "light_cyan"
background = "blue"

[colors.border_active]
foreground = "yellow"
background = "cyan"

[colors.selection_inactive]
foreground = "light_gray"
background = "blue"

[colors.path]
foreground = "white"
background = "blue"

[colors.column_header]
foreground = "light_cyan"
background = "blue"

[colors.error]
foreground = "white"
background = "red"

[colors.warning]
foreground = "white"
background = "brown"

[symbols]
directory = "►"
parent = "↑"
selected = "»"
upload = "↑"
download = "↓"

# UI presets; ordinary navigation can change panel/viewer state temporarily.
[layout]
show_menu = true
show_app_identity = true
show_status = true
show_function_bar = true
show_column_separator = "auto"

[panes]
view = "full"
show_size = true
show_modified = true
show_hidden = false
directories_first = true
case_sensitive_sort = false
sort = "name"
size_format = "auto"
date_format = "%Y-%m-%d %H:%M"

[viewer]
line_numbers = true
wrap = false
current_line = true

# External editor command/args/wait belong in [editor] in normal nav.toml.
# UI profiles deliberately do not override operational editor configuration.

# Command = key(s). Omitted commands/context bindings inherit defaults.
[shortcuts]
show_function_bar = true
show_menu_keys = true
show_dialog_keys = true
show_help_keys = true

[keys]
view = ["F3", "Ctrl+V V"]
edit = "F4"
copy = ["F5", "Ctrl+F C"]
move = ["F6", "Ctrl+F M"]
mkdir = ["F7", "Ctrl+F K"]
delete = ["F8", "Ctrl+F D"]
pane_switch = ["Tab", "Ctrl+P S"]
parent = ["Backspace", "Ctrl+PgUp", "Alt+Up", "Ctrl+N P"]
refresh = ["Ctrl+N R", "Ctrl+R R"]
location = ["Ctrl+L", "Ctrl+N O"]
# Download is menu/button driven by default; optional Viewer shortcut:
# [keys.viewer.commands]
# download = "Alt+D"

[keys.global.commands]
"help.open" = ["F1", "Ctrl+H"]
"app.quit" = ["Ctrl+Q", "F10"]
"menu.open" = ["Ctrl+\\", "F2"]
"profile.preferences" = "Ctrl+T P"

# Panel-only navigation and command families. The root [keys] entries above
# use their normal default contexts; this section makes the remaining panel
# controls explicit.
[keys.panel.commands]
"file.open" = ["Enter", "Ctrl+PgDn", "Ctrl+F O"]
"file.rename" = "Ctrl+F R"
"panel.swap" = ["Ctrl+U", "Ctrl+P W"]
"navigation.back" = ["Alt+Left", "Ctrl+N B"]
"navigation.forward" = ["Alt+Right", "Ctrl+N F"]
"cursor.up" = "Up"
"cursor.down" = "Down"
"cursor.left" = "Left"
"cursor.right" = "Right"
"cursor.home" = "Home"
"cursor.end" = "End"
"cursor.page_up" = "PageUp"
"cursor.page_down" = "PageDown"
"panel.filter" = ["/", "Ctrl+S F"]
"remote.connect" = "Ctrl+R O"
"vault.open" = "Ctrl+R V"
"panel.brief" = "Ctrl+P B"
"panel.full" = "Ctrl+P F"
"config.open" = "Ctrl+T C"
"config.reload" = "Ctrl+T R"
"theme.info" = "Ctrl+T T"

[keys.viewer.commands]
"viewer.close" = ["Escape", "Ctrl+Q", "F10"]
"search.find" = ["Ctrl+S", "/"]
"search.next" = "F5"
"search.previous" = "F6"
"viewer.goto" = "G"
"viewer.wrap" = "W"
"viewer.lines" = "L"
"cursor.up" = "Up"
"cursor.down" = "Down"
"cursor.left" = "Left"
"cursor.right" = "Right"
"cursor.home" = ["Home", "Ctrl+Home"]
"cursor.end" = ["End", "Ctrl+End"]
"cursor.page_up" = "PageUp"
"cursor.page_down" = "PageDown"
"cursor.left_fast" = "Ctrl+Left"
"cursor.right_fast" = "Ctrl+Right"

[keys.menu.commands]
"cursor.up" = "Up"
"cursor.down" = "Down"
