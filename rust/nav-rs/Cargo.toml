[package]
name = "nav-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental Rust core for Navi8or"
publish = false

[dependencies]
libc = "0.2"
unicode-width = "0.2"
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls", "proxy-from-env"] }
native-tls = "0.2"
url = "2.5"
html-escape = "0.2"
percent-encoding = "2"
base64 = "0.22"
toml = "0.8"
